      <div class="crm-price-research__zone crm-price-research__zone--result">

<style>

  .crm-price-research *,
  .crm-price-research *::before,
  .crm-price-research *::after {
    box-sizing: border-box;
  }

    width: 100%;
    padding: clamp(28px, 3.5vw, 48px) 16px;
    color: #17172b;
    background: #ffffff;
    font-family: Montserrat, sans-serif;
  }

  .crm-price-research__card {
    position: relative;
    width: min(100%, 1340px);
    margin: 0 auto;
    overflow: hidden;
    border: 1px solid rgba(91, 104, 214, 0.16);
    border-radius: 28px;
    background: linear-gradient(118deg, #f4f9ff 0%, #f6f5ff 58%, #f8f9ff 100%);
    box-shadow: 0 14px 40px rgba(63, 73, 136, 0.08);
  }

  .crm-price-research__accent {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 3px;
    transform-origin: left center;
    background: linear-gradient(90deg, #25a8ef 0%, #6759e8 60%, #a761e7 100%);
  }

  .crm-price-research__main {
    display: grid;
    grid-template-columns: minmax(0, 31fr) minmax(0, 33fr) minmax(0, 36fr);
    align-items: stretch;
    padding: 25px 36px 19px;
  }

  .crm-price-research__zone {
    min-width: 0;
  }

  .crm-price-research__zone--intro {
    display: flex;
    align-items: center;
    padding-right: clamp(22px, 2.2vw, 34px);
  }

  .crm-price-research__zone--result,
  .crm-price-research__zone--details {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding-left: clamp(22px, 2.4vw, 36px);
  }

  .crm-price-research__zone--result {
    padding-right: clamp(22px, 2.4vw, 36px);
  }

  .crm-price-research__zone--result::before,
  .crm-price-research__zone--details::before {
    position: absolute;
    top: 10px;
    bottom: 10px;
    left: 0;
    width: 1px;
    background: rgba(64, 74, 135, 0.1);
    content: "";
  }

  .crm-price-research__title {
    margin: 0;
    color: #17172b;
    font-family: Montserrat, sans-serif;
    font-size: clamp(22px, 1.7vw, 24px);
    font-weight: 600;
    line-height: 1.3;
    letter-spacing: -0.02em;
  }

  .crm-price-research__value {
    display: flex;
    flex-wrap: nowrap;
    margin: 0;
    color: #554fd7;
    background: linear-gradient(100deg, #168ee1 0%, #6555df 58%, #8c4fc8 100%);
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-size: clamp(34px, 3.2vw, 46px);
    font-weight: 600;
    line-height: 1.1;
    letter-spacing: -0.045em;

  }

  .crm-price-research__caption {
    margin: 6px 0 0;
    color: #393953;
    font-size: 18px;
    font-weight: 500;
    line-height: 1.35;
  }

  .crm-price-research__description {
    margin: 0;
    color: #303047;

    font-weight: 500;
    line-height: 1.5;
  }

  .crm-price-research__link-placeholder {
    display: inline-block;
    align-self: flex-start;
    margin-top: 7px;
    color: #385dcc;
    font-size: 15px;
    font-weight: 600;
    line-height: 1.5;
  }

  .crm-price-research__note {
    margin: 0 36px;
    padding: 8px 0 10px;
    border-top: 1px solid rgba(64, 74, 135, 0.11);
    color: #55556b;
    font-size: 12px;
    font-weight: 400;
    line-height: 1.45;
  }

  .crm-price-research.is-motion-ready .crm-price-research__card {
    opacity: 0;
    transform: translateY(18px);
  }

  .crm-price-research.is-motion-ready.is-visible .crm-price-research__card {
    opacity: 1;
    transform: translateY(0);
    transition: opacity 0.6s ease, transform 0.75s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .crm-price-research.is-motion-ready .crm-price-research__accent {
    transform: scaleX(0);
  }

  .crm-price-research.is-motion-ready.is-visible .crm-price-research__accent {
    transform: scaleX(1);
    transition: transform 0.9s 0.12s cubic-bezier(0.22, 1, 0.36, 1);
  }

  @media (max-width: 1100px) {
    .crm-price-research__main {
      grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
      padding: 26px 32px 20px;
    }

    .crm-price-research__zone--details {
      grid-column: 1 / -1;
      margin-top: 20px;
      padding: 18px 0 0;
    }

    .crm-price-research__zone--details::before {
      top: 0;
      right: 0;
      bottom: auto;
      width: auto;
      height: 1px;
    }
  }

  @media (max-width: 767px) {
    .crm-price-research {
      padding: 28px 16px;
    }

    .crm-price-research__card {
      border-radius: 24px;
    }

    .crm-price-research__main {
      grid-template-columns: 1fr;
      padding: 23px 20px 17px;
      text-align: center;
    }

    .crm-price-research__zone--intro,
    .crm-price-research__zone--result,
    .crm-price-research__zone--details {
      padding-right: 0;
      padding-left: 0;
    }

    .crm-price-research__zone--result,
    .crm-price-research__zone--details {
      margin-top: 18px;
      padding-top: 18px;
    }

    .crm-price-research__zone--result::before,
    .crm-price-research__zone--details::before {
      display: none;
    }

    .crm-price-research__link-placeholder {
      align-self: center;
      margin-right: auto;
      margin-left: auto;
    }

    .crm-price-research__title {
      font-size: clamp(22px, 6.5vw, 24px);
      line-height: 1.32;
    }

    .crm-price-research__value {
      justify-content: center;
      font-size: clamp(34px, 10.2vw, 38px);
    }

    .crm-price-research__caption {
      font-size: 17px;
    }

    .crm-price-research__description {
      font-size: 15px;
      line-height: 1.55;
    }

    .crm-price-research__note {
      margin: 0 20px;
      padding: 8px 0 12px;
      text-align: center;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .crm-price-research .crm-price-research__card,
    .crm-price-research .crm-price-research__accent {
      opacity: 1;
      transform: none;
      transition: none;
    }
  }
</style>

<script>
  (() => {
    const blocks = document.querySelectorAll('[data-crm-price-research]');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    blocks.forEach((block) => {
      const value = block.querySelector('[data-crm-price-value]');

      if (!value || reduceMotion || !('IntersectionObserver' in window)) {
        return;
      }

      block.classList.add('is-motion-ready');

      const showBlock = () => {
        block.classList.add('is-visible');
        const start = performance.now();
        const duration = 900;

        const updateValue = (now) => {
          const progress = Math.min((now - start) / duration, 1);
          const easedProgress = 1 - Math.pow(1 - progress, 3);
          value.textContent = (2.75 * easedProgress).toLocaleString('ru-RU', {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          });

          if (progress < 1) {
            window.requestAnimationFrame(updateValue);
          } else {
            value.textContent = '2,75';
          }
        };

        value.textContent = '0,00';
        window.requestAnimationFrame(updateValue);
      };

      const observer = new IntersectionObserver((entries) => {
        if (entries.some((entry) => entry.isIntersecting)) {
          observer.disconnect();
          showBlock();
        }
      }, { threshold: 0.25 });

      observer.observe(block);
    });
  })();
</script>
