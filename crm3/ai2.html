<script>
  (() => {
    const root = document.querySelector('.crm2-ai2');

    if (!root) {
      return;
    }

    const tabs = Array.from(root.querySelectorAll('[data-crm2-ai2-tab]'));
    const images = Array.from(root.querySelectorAll('[data-crm2-ai2-image]'));
    const panel = root.querySelector('[data-crm2-ai2-screen]');
    const switchDelay = 3600;
    let activeIndex = 0;
    let autoSwitchTimer = null;

    if (!tabs.length || tabs.length !== images.length || !panel) {
      return;
    }

    const normalizeIndex = (index) => (index + tabs.length) % tabs.length;

    const setActiveTab = (nextIndex) => {
      activeIndex = normalizeIndex(nextIndex);

      tabs.forEach((tab, index) => {
        const isActive = index === activeIndex;
        tab.classList.toggle('is-active', isActive);
        tab.setAttribute('aria-selected', String(isActive));
        tab.setAttribute('tabindex', isActive ? '0' : '-1');
      });

      images.forEach((image, index) => {
        image.classList.toggle('is-active', index === activeIndex);
      });

      panel.setAttribute('aria-labelledby', tabs[activeIndex].id);
    };

    const startAutoSwitch = () => {
      window.clearInterval(autoSwitchTimer);
      autoSwitchTimer = window.setInterval(() => {
        setActiveTab(activeIndex + 1);
      }, switchDelay);
    };

    tabs.forEach((tab, index) => {
      tab.addEventListener('click', () => {
        setActiveTab(index);
        startAutoSwitch();
      });

      tab.addEventListener('keydown', (event) => {
        if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') {
          return;
        }

        event.preventDefault();
        const direction = event.key === 'ArrowRight' ? 1 : -1;
        const nextIndex = normalizeIndex(activeIndex + direction);
        setActiveTab(nextIndex);
        tabs[nextIndex].focus();
        startAutoSwitch();
      });
    });

    setActiveTab(0);
    startAutoSwitch();
  })();
</script>
