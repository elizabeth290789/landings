<!-- Блок «Вместо десятка сервисов — одно решение Битрикс24» -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  .b24one{position:relative;overflow:hidden;padding:110px 20px 120px;font-family:'Montserrat',Arial,sans-serif;color:#fff;text-align:center;
    background:radial-gradient(ellipse at 50% 120%,rgba(110,78,234,.55),transparent 60%),linear-gradient(100deg,#2c74ec 0%,#6e4eea 48%,#c33baa 100%);}
  .b24one *{box-sizing:border-box;}
  .b24one__inner{position:relative;z-index:2;max-width:820px;margin:0 auto;}
  .b24one__title{margin:0 0 20px;font-size:44px;line-height:1.18;font-weight:700;color:#fff !important;font-family:'Montserrat',Arial,sans-serif !important;letter-spacing:-.01em;}
  .b24one__text{margin:0 auto 36px;max-width:640px;font-size:20px;line-height:1.5;font-weight:500;opacity:.95;color:#fff !important;}
  .b24one__tags{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:0 auto 44px;max-width:780px;padding:0;list-style:none;}
  .b24one__tag{display:inline-flex;align-items:center;gap:8px;padding:9px 18px 9px 10px;border-radius:999px;font-size:15px;font-weight:500;line-height:1.2;color:#fff !important;
    background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:background .2s;}
  .b24one__tag:hover{background:rgba(255,255,255,.26);}
  .b24one__tag i{flex:none;display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:#2fc84a;}
  .b24one__tag i svg{width:11px;height:11px;}
  .b24one__tag--ai{background:rgba(201,254,26,.18);border-color:#c9fe1a;font-weight:600;}
  .b24one__btn{display:inline-block;padding:20px 40px;border-radius:999px;background:#c9fe1a;color:#1b1b2f;font-size:14px;font-weight:700;letter-spacing:.04em;
    text-transform:uppercase;text-decoration:none;box-shadow:0 8px 28px rgba(201,254,26,.45);transition:transform .2s,box-shadow .2s;}
  .b24one__btn:hover{transform:translateY(-2px);box-shadow:0 12px 34px rgba(201,254,26,.6);}
  .b24one__ico{position:absolute;z-index:1;display:flex;align-items:center;justify-content:center;border-radius:28%;
    box-shadow:0 14px 34px rgba(20,10,80,.35);animation:b24one-float 6s ease-in-out infinite;}
  .b24one__ico svg{width:52%;height:52%;}
  .b24one__ico--cart{width:120px;height:120px;left:11%;top:13%;background:#ff3fcf;}
  .b24one__ico--video{width:88px;height:88px;left:8%;top:47%;background:#6b3cff;animation-delay:-2s;}
  .b24one__ico--ai{width:100px;height:100px;left:19%;bottom:10%;background:#14122b;animation-delay:-4s;}
  .b24one__ico--funnel{width:72px;height:72px;right:16%;top:14%;background:#ff9a2e;animation-delay:-1s;}
  .b24one__ico--gear{width:116px;height:116px;right:9%;top:44%;background:#ff3b3b;animation-delay:-3s;}
  .b24one__ico--team{width:74px;height:74px;right:17%;bottom:12%;background:#ffd23a;animation-delay:-5s;}
  .b24one__ico--ai span{font-size:44px;font-weight:800;color:#fff;letter-spacing:-.02em;}
  @keyframes b24one-float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-14px) rotate(-3deg)}}
  @media (prefers-reduced-motion:reduce){.b24one__ico{animation:none;}}
  @media (max-width:1200px){
    .b24one__ico{transform:scale(.8);}
    .b24one__ico--cart{left:3%;}.b24one__ico--video{left:2%;}.b24one__ico--ai{left:6%;}
    .b24one__ico--funnel{right:6%;}.b24one__ico--gear{right:2%;}.b24one__ico--team{right:6%;}
  }
  @media (max-width:960px){
    .b24one{padding:150px 16px 150px;}
    .b24one__ico{animation:none;}
    .b24one__ico--cart{width:64px;height:64px;left:6%;top:30px;}
    .b24one__ico--funnel{width:48px;height:48px;right:auto;left:42%;top:46px;}
    .b24one__ico--gear{width:60px;height:60px;right:6%;top:32px;}
    .b24one__ico--video{width:52px;height:52px;left:8%;top:auto;bottom:36px;}
    .b24one__ico--ai{width:60px;height:60px;left:42%;bottom:30px;}
    .b24one__ico--team{width:50px;height:50px;right:8%;bottom:40px;}
    .b24one__ico--ai span{font-size:26px;}
  }
  @media (max-width:600px){
    .b24one__title{font-size:28px;}
    .b24one__text{font-size:16px;margin-bottom:28px;}
    .b24one__tags{gap:8px;margin-bottom:32px;}
    .b24one__tag{font-size:13px;padding:7px 14px 7px 8px;}
    .b24one__btn{width:100%;max-width:340px;padding:18px 24px;}
  }
</style>

<section class="b24one">
  <!-- Иконки сервисов -->
  <div class="b24one__ico b24one__ico--cart" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="#fff"><path d="M2 3.5h2.6l2.3 10.6c.1.6.7 1 1.3 1h9.4c.6 0 1.1-.4 1.3-1l1.9-7.6H6.1"/><path d="M2 3.5h2.6l2.3 10.6c.1.6.7 1 1.3 1h9.4c.6 0 1.1-.4 1.3-1l1.9-7.6H6.1" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="9" cy="19.5" r="1.8"/><circle cx="17" cy="19.5" r="1.8"/></svg>
  </div>
  <div class="b24one__ico b24one__ico--video" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="#fff"><rect x="1.5" y="6" width="14" height="12" rx="3.5"/><path d="M17 10.2l4.2-2.6c.6-.4 1.3.1 1.3.8v7.2c0 .7-.7 1.2-1.3.8L17 13.8z"/></svg>
  </div>
  <div class="b24one__ico b24one__ico--ai" aria-hidden="true"><span>AI</span></div>
  <div class="b24one__ico b24one__ico--funnel" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="#fff"><path d="M3 4h18l-7 8.5V20l-4-2v-5.5z" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>
  </div>
  <div class="b24one__ico b24one__ico--gear" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path fill="#fff" d="M13.6 2l.5 2.6c.7.2 1.3.5 1.9.9l2.4-1.2 2.2 2.2-1.2 2.4c.4.6.7 1.2.9 1.9l2.6.5v3.2l-2.6.5c-.2.7-.5 1.3-.9 1.9l1.2 2.4-2.2 2.2-2.4-1.2c-.6.4-1.2.7-1.9.9l-.5 2.6h-3.2l-.5-2.6c-.7-.2-1.3-.5-1.9-.9l-2.4 1.2-2.2-2.2 1.2-2.4c-.4-.6-.7-1.2-.9-1.9L2 13.6v-3.2l2.6-.5c.2-.7.5-1.3.9-1.9L4.3 5.6l2.2-2.2 2.4 1.2c.6-.4 1.2-.7 1.9-.9l.5-2.6z"/><circle cx="12" cy="12" r="3.6" fill="#ff3b3b"/></svg>
  </div>
  <div class="b24one__ico b24one__ico--team" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="#fff"><circle cx="9" cy="8" r="3.6"/><path d="M2 20c0-3.9 3.1-6.5 7-6.5s7 2.6 7 6.5z"/><circle cx="17" cy="9" r="2.8"/><path d="M17.5 13.6c2.7.3 4.5 2.6 4.5 5.9h-4.3c0-2.4-.8-4.4-2.3-5.6.7-.2 1.4-.3 2.1-.3z"/></svg>
  </div>

  <div class="b24one__inner">
    <h2 class="b24one__title">Вместо десятка сервисов для&nbsp;бизнеса&nbsp;— одно решение Битрикс24</h2>
    <p class="b24one__text">Битрикс24 — это полноценное рабочее место, где есть всё необходимое</p>

    <ul class="b24one__tags">
      <li class="b24one__tag"><i><svg viewBox="0 0 12 12"><path d="M2.5 6.2l2.3 2.3 4.7-5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></i>Совместная работа</li>
      <li class="b24one__tag"><i><svg viewBox="0 0 12 12"><path d="M2.5 6.2l2.3 2.3 4.7-5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></i>Сайты и Магазины</li>
      <li class="b24one__tag"><i><svg viewBox="0 0 12 12"><path d="M2.5 6.2l2.3 2.3 4.7-5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></i>CRM</li>
      <li class="b24one__tag"><i><svg viewBox="0 0 12 12"><path d="M2.5 6.2l2.3 2.3 4.7-5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></i>Мессенджер</li>
      <li class="b24one__tag"><i><svg viewBox="0 0 12 12"><path d="M2.5 6.2l2.3 2.3 4.7-5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></i>Задачи и проекты</li>
      <li class="b24one__tag"><i><svg viewBox="0 0 12 12"><path d="M2.5 6.2l2.3 2.3 4.7-5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></i>Автоматизация</li>
      <li class="b24one__tag b24one__tag--ai"><i><svg viewBox="0 0 12 12"><path d="M2.5 6.2l2.3 2.3 4.7-5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></i>AI-помощник BitrixGPT</li>
      <li class="b24one__tag"><i><svg viewBox="0 0 12 12"><path d="M2.5 6.2l2.3 2.3 4.7-5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></i>Доски</li>
    </ul>

    <a class="b24one__btn" href="#">Получить бесплатно</a>
  </div>
</section>
