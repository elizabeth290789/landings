     Фон секции: #ffffff

<style>
.b24ab-who{
    box-sizing:border-box;
    padding:92px 20px;
    background:#ffffff;
    font-family:'Montserrat','Helvetica Neue',Arial,sans-serif;
    color:#111417;
}
.b24ab-who *{box-sizing:border-box;}
.b24ab-who__inner{max-width:1120px;margin:0 auto;}

.b24ab-who__title{
    margin:0 0 56px;
    font-size:40px;
    line-height:1.16;
    font-weight:800;
    letter-spacing:-.02em;
    text-align:center;
}
.b24ab-who__title span{color:#33bbf5;}

.b24ab-who__grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:52px 30px;
    margin:0;
    padding:0;
    list-style:none;
}
.b24ab-who__item{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    margin:0;
}
.b24ab-who__ico{
    width:52px;
    height:52px;
    margin-bottom:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform .22s ease;
}
.b24ab-who__ico svg{width:44px;height:44px;display:block;}
.b24ab-who__item:hover .b24ab-who__ico{transform:translateY(-4px);}

.b24ab-who__label{
    margin:0;
    font-size:18px;
    line-height:1.35;
    font-weight:600;
    color:#1a1f26;
}

@media (max-width:1024px){
    .b24ab-who__title{font-size:31px;}
    .b24ab-who__grid{gap:44px 24px;}
}
@media (max-width:680px){
    .b24ab-who{padding:56px 16px;}
    .b24ab-who__title{font-size:24px;margin-bottom:38px;}
    .b24ab-who__grid{grid-template-columns:repeat(2,1fr);gap:38px 18px;}
    .b24ab-who__label{font-size:16px;}
}
@media (max-width:400px){
    .b24ab-who__grid{grid-template-columns:1fr;gap:30px;}
}
@media (prefers-reduced-motion:reduce){
    .b24ab-who__ico{transition:none;}
    .b24ab-who__item:hover .b24ab-who__ico{transform:none;}
}
</style>
