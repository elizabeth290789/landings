<script>
  (function () {
    const slides = [
      {
        image: 'https://www.bitrix24.ru/upload/optimizer/converted/images/content_ru/features/company/chat/1.1600w.png.webp?1780063682225',
        alt: 'Интерфейс Битрикс24 для рабочих чатов и каналов'
      },
      {
        image: 'https://www.bitrix24.ru/upload/optimizer/converted/images/content_ru/features/company/chat/3.1600w.png.webp?1780063682225',
        alt: 'Интерфейс Битрикс24 для видеовстреч команды'
      },
      {
        image: 'https://www.bitrix24.ru/upload/optimizer/converted/images/content_ru/features/tasks/1.1600w.png.webp?1780063682225',
        alt: 'Интерфейс Битрикс24 для задач и проектов'
      },
      {
        image: 'https://www.bitrix24.ru/upload/optimizer/converted/images/content_ru/features/copilot/88.1600w.png.webp?1780063682225',
        alt: 'Интерфейс Битрикс24 с AI-помощником'
      }
    ];

    const initCollabTabs = function (root) {
      const tabs = Array.from(root.querySelectorAll('.b24-collab-tabs__tab'));
      const image = root.querySelector('.b24-collab-tabs__screen');
      let activeIndex = 0;
      let switchTimer = null;

      if (!tabs.length || !image) {
        return;
      }

      const setActiveTab = function (activeIndex) {
        tabs.forEach(function (tab, index) {
          const isActive = index === activeIndex;
          tab.classList.toggle('is-active', isActive);
          tab.setAttribute('aria-selected', String(isActive));
        });
      };

      const showSlide = function (nextIndex) {
        const slide = slides[nextIndex];

        if (!slide || nextIndex === activeIndex) {
          return;
        }

        activeIndex = nextIndex;
        setActiveTab(nextIndex);
        window.clearTimeout(switchTimer);
        image.classList.add('is-switching');

        switchTimer = window.setTimeout(function () {
          image.src = slide.image;
          image.alt = slide.alt;
          image.classList.remove('is-switching');
        }, 140);
      };

      tabs.forEach(function (tab, fallbackIndex) {
        tab.addEventListener('click', function (event) {
          event.preventDefault();

          const slideIndex = Number(tab.dataset.slide);
          showSlide(Number.isNaN(slideIndex) ? fallbackIndex : slideIndex);
        });
      });
    };

    document.querySelectorAll('.b24-collab-tabs').forEach(initCollabTabs);
  })();
</script>
