<style>
  .b24-collab-tabs {
    position: relative;
    overflow: hidden;
    isolation: isolate;
    margin: clamp(28px, 5vw, 64px) auto;
    width: min(calc(100% - 32px), 1320px);
    padding: clamp(42px, 6vw, 78px) clamp(16px, 4vw, 56px) clamp(34px, 5vw, 62px);
    border-radius: 0;
    color: #ffffff;
    background: transparent;
    box-shadow: none;
  }

  .b24-collab-tabs,
  .b24-collab-tabs * {
    box-sizing: border-box;
  }

  .b24-collab-tabs::before {
    content: none;
  }

  .b24-collab-tabs::after {
    content: "";
    position: absolute;
    inset: auto 8% -32% 8%;
    z-index: -1;
    height: 44%;
    border-radius: 999px;
    background: rgba(41, 132, 255, 0.26);
    filter: blur(84px);
    pointer-events: none;
  }

  .b24-collab-tabs__orb,
  .b24-collab-tabs__spark {
    position: absolute;
    pointer-events: none;
    z-index: -1;
  }

  .b24-collab-tabs__orb {
    border-radius: 999px;
    filter: blur(44px);
    opacity: 0.8;
  }

  .b24-collab-tabs__orb--one {
    width: min(45vw, 520px);
    height: min(45vw, 520px);
    top: -220px;
    right: -150px;
    background: radial-gradient(circle, rgba(127, 151, 255, 0.54), transparent 70%);
  }

  .b24-collab-tabs__orb--two {
    width: min(42vw, 470px);
    height: min(42vw, 470px);
    left: -190px;
    bottom: -210px;
    background: radial-gradient(circle, rgba(47, 150, 255, 0.42), transparent 72%);
  }

  .b24-collab-tabs__spark {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: rgba(207, 228, 255, 0.78);
    box-shadow: 0 0 22px rgba(103, 174, 255, 0.78);
    animation: b24-collab-tabs-float 8s ease-in-out infinite;
  }

  .b24-collab-tabs__spark--one { top: 16%; left: 11%; }
  .b24-collab-tabs__spark--two { top: 24%; right: 17%; animation-delay: 1.2s; }
  .b24-collab-tabs__spark--three { bottom: 21%; right: 9%; animation-delay: 2s; }

  .b24-collab-tabs__container {
    width: 100%;
    max-width: 1120px;
    margin: 0 auto;
    text-align: center;
  }

  .b24-collab-tabs__header {
    max-width: 920px;
    margin: 0 auto;
  }

  .b24-collab-tabs__eyebrow {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin: 0 0 14px;
    padding: 9px 16px;
    border: 1px solid rgba(176, 204, 255, 0.32);
    border-radius: 999px;
    color: #dce9ff;
    background: rgba(13, 36, 88, 0.44);
    backdrop-filter: blur(12px);
    font-size: 14px;
    line-height: 1;
  }

  .b24-collab-tabs__title {
    margin: 0 auto;
    max-width: 940px;
    color: #ffffff;
    font-size: clamp(34px, 4vw, 58px);
    font-weight: 700;
    line-height: 1.06;
    letter-spacing: -0.035em;
  }

  .b24-collab-tabs__subtitle {
    max-width: 780px;
    margin: clamp(14px, 2vw, 22px) auto 0;
    color: #d2e2ff;
    font-size: clamp(17px, 1.7vw, 23px);
    line-height: 1.5;
  }

  .b24-collab-tabs__nav-wrap {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: clamp(24px, 3.2vw, 38px) auto 0;
    padding: 7px;
    width: fit-content;
    max-width: 100%;
    border: 1px solid rgba(187, 212, 255, 0.22);
    border-radius: 999px;
    background: rgba(9, 28, 75, 0.32);
    backdrop-filter: blur(16px);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }

  .b24-collab-tabs__tab {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 48px;
    padding: 0 22px;
    border: 1px solid rgba(255, 255, 255, 0.38);
    border-radius: 999px;
    color: #f3f7ff;
    background: rgba(255, 255, 255, 0.08);
    font: inherit;
    font-size: 16px;
    font-weight: 650;
    line-height: 1;
    white-space: nowrap;
    cursor: pointer;
    transition: color 0.3s ease, background-color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease;
  }

  .b24-collab-tabs__tab:hover {
    background: rgba(255, 255, 255, 0.15);
    transform: translateY(-1px);
  }

  .b24-collab-tabs__tab.is-active {
    color: #06183f;
    border-color: rgba(255, 255, 255, 0.98);
    background: #ffffff;
    box-shadow: 0 16px 34px rgba(5, 18, 58, 0.24), 0 0 0 1px rgba(255, 255, 255, 0.45) inset;
  }

  .b24-collab-tabs__stage {
    margin: clamp(26px, 3.5vw, 44px) auto 0;
    transition: opacity 0.36s ease, transform 0.36s ease;
  }

  .b24-collab-tabs__stage.is-switching {
    opacity: 0;
    transform: translateY(12px) scale(0.985);
  }

  .b24-collab-tabs__screen-shell {
    position: relative;
    width: 100%;
    max-width: 900px;
    margin: 32px auto 0;
    padding: 0;
    border: 0;
    background: transparent;
    box-shadow: none;
    backdrop-filter: none;
    overflow: visible;
  }

  .b24-collab-tabs__screen-shell::before,
  .b24-collab-tabs__screen-shell::after {
    content: none;
  }

  .b24-collab-tabs__screen {
    display: block;
    width: 100%;
    height: auto;
    object-fit: contain;
    object-position: center;
    border-radius: 18px;
  }

  .b24-collab-tabs__caption {
    max-width: 720px;
    margin: clamp(18px, 2.6vw, 30px) auto 0;
  }

  .b24-collab-tabs__caption-title {
    margin: 0;
    color: #ffffff;
    font-size: clamp(24px, 2.6vw, 36px);
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: -0.02em;
  }

  .b24-collab-tabs__caption-text {
    margin: 8px auto 0;
    color: #d4e3ff;
    font-size: clamp(16px, 1.55vw, 20px);
    line-height: 1.5;
  }

  @keyframes b24-collab-tabs-float {
    0%, 100% { opacity: 0.35; transform: translate3d(0, 0, 0); }
    50% { opacity: 0.9; transform: translate3d(0, -12px, 0); }
  }

  @media (max-width: 820px) {
    .b24-collab-tabs {
      width: min(calc(100% - 20px), 1320px);
      border-radius: 0;
      padding-right: 0;
      padding-left: 0;
    }

    .b24-collab-tabs__header,
    .b24-collab-tabs__stage {
      padding-right: 16px;
      padding-left: 16px;
    }

    .b24-collab-tabs__nav-wrap {
      justify-content: flex-start;
      width: auto;
      margin-right: 0;
      margin-left: 0;
      padding: 6px 16px 10px;
      overflow-x: auto;
      border-radius: 0;
      border-right: 0;
      border-left: 0;
      background: transparent;
      box-shadow: none;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .b24-collab-tabs__nav-wrap::-webkit-scrollbar {
      display: none;
    }

    .b24-collab-tabs__tab {
      min-height: 44px;
      padding: 0 18px;
      font-size: 15px;
    }

  }

  @media (max-width: 520px) {
    .b24-collab-tabs {
      margin-top: 22px;
      margin-bottom: 22px;
      border-radius: 24px;
      padding-top: 34px;
      padding-bottom: 30px;
    }

    .b24-collab-tabs__eyebrow {
      font-size: 12px;
    }

    .b24-collab-tabs__title {
      font-size: clamp(29px, 9vw, 40px);
      letter-spacing: -0.028em;
    }

    .b24-collab-tabs__subtitle {
      font-size: 16px;
    }

  }
</style>

<script>
  (function () {
    const slides = [
      {
        title: 'Общение',
        text: 'Обсуждайте рабочие вопросы в чатах и каналах.',
        image: 'https://www.bitrix24.ru/upload/optimizer/converted/images/content_ru/features/company/chat/1.1600w.png.webp?1780063682225',
        alt: 'Интерфейс Битрикс24 для рабочих чатов и каналов'
      },
      {
        title: 'Встречи',
        text: 'Проводите созвоны без ссылок и лишних приложений.',
        image: 'https://www.bitrix24.ru/upload/optimizer/converted/images/content_ru/features/company/chat/3.1600w.png.webp?1780063682225',
        alt: 'Интерфейс Битрикс24 для видеовстреч команды'
      },
      {
        title: 'Работа',
        text: 'Превращайте обсуждения в задачи и проекты.',
        image: 'https://www.bitrix24.ru/upload/optimizer/converted/images/content_ru/features/tasks/1.1600w.png.webp?1780063682225',
        alt: 'Интерфейс Битрикс24 для задач и проектов'
      },
      {
        title: 'AI',
        text: 'Получайте итоги встреч и готовые задачи автоматически.',
        image: 'https://www.bitrix24.ru/upload/optimizer/converted/images/content_ru/features/copilot/88.1600w.png.webp?1780063682225',
        alt: 'Интерфейс Битрикс24 с AI-помощником'
      }
    ];

    const initCollabTabs = function (root) {
      const tabs = Array.from(root.querySelectorAll('.b24-collab-tabs__tab'));
      const image = root.querySelector('.b24-collab-tabs__screen');
      const captionTitle = root.querySelector('.b24-collab-tabs__caption-title');
      const captionText = root.querySelector('.b24-collab-tabs__caption-text');

      if (!tabs.length || !image || !captionTitle || !captionText) {
        return;
      }

      const setActiveTab = function (activeIndex) {
        tabs.forEach(function (tab, index) {
          const isActive = index === activeIndex;
          tab.classList.toggle('is-active', isActive);
          tab.setAttribute('aria-selected', String(isActive));
        });
      };

      const showSlide = function (nextIndex) {
        const slide = slides[nextIndex];

        if (!slide) {
          return;
        }

        setActiveTab(nextIndex);
        image.src = slide.image;
        image.alt = slide.alt;
        captionTitle.textContent = slide.title;
        captionText.textContent = slide.text;
      };

      tabs.forEach(function (tab, fallbackIndex) {
        tab.addEventListener('click', function (event) {
          event.preventDefault();

          const slideIndex = Number(tab.dataset.slide);
          showSlide(Number.isNaN(slideIndex) ? fallbackIndex : slideIndex);
        });
      });
    };

    document.querySelectorAll('.b24-collab-tabs').forEach(initCollabTabs);
  })();
</script>
