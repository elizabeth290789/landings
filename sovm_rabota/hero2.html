<script>
  (() => {
    const hero = document.querySelector('.b24-collab-hero');

    if (!hero) {
      return;
    }

    hero.querySelectorAll('.b24-collab-hero__chip').forEach((chip) => {
      chip.addEventListener('click', () => {
        const isSelected = chip.getAttribute('aria-pressed') === 'true';

        chip.setAttribute('aria-pressed', String(!isSelected));
      });
    });
  })();
</script>
