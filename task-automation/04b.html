<!-- ============================================
     БЛОК 04b — AI-АГЕНТЫ
     Префикс классов: b24tz-agents-
     Фон секции: #fcfcfc
     ============================================ -->
<style>
.b24tz-agents{
    box-sizing:border-box;
    padding:88px 20px;
    background:#ffffff;
    font-family:'Montserrat','Helvetica Neue',Arial,sans-serif;
    color:#111417;
}
.b24tz-agents *{box-sizing:border-box;}
.b24tz-agents__inner{
    display:grid;
    grid-template-columns:minmax(0,0.9fr) minmax(0,1.1fr);
    align-items:center;
    gap:52px;
    max-width:1200px;
    margin:0 auto;
    padding:58px 56px;
    border-radius:26px;
    background:linear-gradient(140deg,#2e7ef0 0%,#3b8ff5 55%,#4f9ffa 100%);
}

.b24tz-agents__title{
    margin:0 0 22px;
    font-size:38px;
    line-height:1.16;
    font-weight:800;
    letter-spacing:-.02em;
    color:#fff;
}
.b24tz-agents__lead{
    margin:0 0 20px;
    font-size:19px;
    line-height:1.55;
    color:rgba(255,255,255,.96);
}
.b24tz-agents__body{
    margin:0 0 32px;
    font-size:19px;
    line-height:1.55;
    color:rgba(255,255,255,.96);
}
.b24tz-agents__body p{margin:0 0 14px;}
.b24tz-agents__body p:last-child{margin-bottom:0;}
.b24tz-agents__body b{color:#fff;font-weight:700;}

.b24tz-agents__cta{
    display:inline-block;
    padding:19px 44px;
    border-radius:16px;
    background:#c5f048;
    color:#111417 !important;
    font-size:18px;
    font-weight:700;
    line-height:1;
    text-decoration:none;
    box-shadow:0 8px 22px rgba(4,60,130,.12);
    transition:background .18s ease, transform .18s ease;
}
.b24tz-agents__cta.b24tz-agents__cta:hover,.b24tz-agents__cta:hover{background:#d3fa5f;transform:translateY(-2px);text-decoration:none;color:#111417 !important;}
.b24tz-agents__cta:focus-visible{outline:3px solid #fff;outline-offset:3px;}

.b24tz-agents__media{
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 16px 44px rgba(4,60,130,.2);
}
.b24tz-agents__media img{
    display:block;
    width:100%;
    aspect-ratio:1460/900;
    height:auto;
    object-fit:cover;
    object-position:center;
}

@media (max-width:1024px){
    .b24tz-agents__title{font-size:29px;}
    .b24tz-agents__inner{gap:36px;padding:44px 34px;}
}
@media (max-width:860px){
    .b24tz-agents__inner{grid-template-columns:1fr;gap:30px;}
}
@media (max-width:640px){
    .b24tz-agents{padding:56px 16px;}
    .b24tz-agents__inner{padding:32px 22px;border-radius:20px;}
    .b24tz-agents__title{font-size:24px;}
    .b24tz-agents__lead{font-size:17px;}
    .b24tz-agents__body{font-size:17px;}
    .b24tz-agents__cta{display:block;text-align:center;padding:16px 24px;}
}
@media (prefers-reduced-motion:reduce){
    .b24tz-agents__cta{transition:none;}
    .b24tz-agents__cta:hover{transform:none;}
}
</style>

<section class="b24tz-agents">
  <div class="b24tz-agents__inner">

    <div class="b24tz-agents__text-col">
      <h2 class="b24tz-agents__title">AI-агенты —<br>новая рабочая сила</h2>
      <p class="b24tz-agents__lead">
        Искусственный интеллект берёт на себя рутину: агенты сами ведут задачи,
        отвечают клиентам в чатах и работают с вашими данными — даже во внешних
        сервисах и 1С.
      </p>

      <div class="b24tz-agents__body">
        <p>Настраиваются без программистов, работают круглосуточно.</p>
      </div>
      <a class="b24tz-agents__cta" href="https://www.bitrix24.ru/create.php?coupon=autodemo-tasks&b24_type=tasks">Начать бесплатно</a>
    </div>

    <div class="b24tz-agents__media">
      <img src="https://www.bitrix24.ru/upload/optimizer/converted/images/content_ru/features/automatization/ai-agents/11.1900w.png.webp?1784204064972" alt="Конструктор бизнес-процессов с AI-агентом в Битрикс24" loading="lazy">
    </div>

  </div>
</section>
