  .b24-ai-helper-option--selected,

  }

  .b24-ai-helper-option--selected:focus,
  .b24-ai-helper-option--selected:focus-visible,
  .b24-ai-helper-option--selected:focus-within {
    background: #f4fbff;
    border: 2px solid #2ea7f8;
    box-shadow: 0 0 0 3px rgba(46,167,248,.25), 0 8px 24px rgba(46,167,248,.12);
    outline: none;
    transform: translateY(-1px);
  }

  .b24-ai-helper-option__title {
    font-size: 16px;

  .b24-ai-helper-action {

  .b24-ai-helper-action--primary {

<script>
  (function (){var b24AiHelperWidget = document.querySelector('[data-b24-ai-helper-widget]');

    if (!b24AiHelperWidget){return;}var b24AiHelperLaunch = b24AiHelperWidget.querySelector('.b24-ai-helper-launch');
    var b24AiHelperCard = b24AiHelperWidget.querySelector('.b24-ai-helper-card');
    var b24AiHelperOptions = b24AiHelperWidget.querySelectorAll('[data-b24-ai-helper-option]');
    var b24AiHelperCta = b24AiHelperWidget.querySelector('[data-b24-ai-helper-cta]');

    function b24AiHelperSetOpen(isOpen){b24AiHelperWidget.classList.toggle('b24-ai-helper-widget--open', isOpen);
      b24AiHelperLaunch.setAttribute('aria-expanded', String(isOpen));
      b24AiHelperCard.setAttribute('aria-hidden', String(!isOpen));}b24AiHelperLaunch.addEventListener('click', function (){b24AiHelperSetOpen(!b24AiHelperWidget.classList.contains('b24-ai-helper-widget--open'));});

    function b24AiHelperEnableCta(){b24AiHelperCta.classList.remove('b24-ai-helper-action--disabled');
      b24AiHelperCta.removeAttribute('aria-disabled');
      b24AiHelperCta.removeAttribute('tabindex');}


    b24AiHelperOptions.forEach(function (b24AiHelperOption){b24AiHelperOption.addEventListener('click', function (){b24AiHelperOptions.forEach(function (b24AiHelperItem){b24AiHelperItem.classList.remove('b24-ai-helper-option--selected');
          b24AiHelperItem.setAttribute('aria-pressed', 'false');});

        b24AiHelperOption.classList.add('b24-ai-helper-option--selected');
        b24AiHelperOption.setAttribute('aria-pressed', 'true');
        b24AiHelperEnableCta();});});

    b24AiHelperCta.addEventListener('click', function (event){if (b24AiHelperCta.getAttribute('aria-disabled') === 'true'){event.preventDefault();}});

    document.addEventListener('keydown', function (event){if (event.key === 'Escape'){b24AiHelperSetOpen(false);}});})();
</script>
