<style>
  .b24-ai-helper-widget,
  .b24-ai-helper-widget * {

  }

  .b24-ai-helper-widget button:focus-visible,
  .b24-ai-helper-widget button:active,

  .b24-ai-helper-widget a:focus,
  .b24-ai-helper-widget a:focus-visible,

  .b24-ai-helper-launch {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 56px;
    height: 56px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    color: #ffffff;
    background: linear-gradient(135deg, var(--b24-ai-helper-blue) 0%, var(--b24-ai-helper-blue-dark) 100%);
    box-shadow: 0 8px 24px rgba(46,167,248,.25);
    cursor: pointer;
    transition: transform 0.22s ease, box-shadow 0.22s ease, opacity 0.22s ease;
  }

  .b24-ai-helper-launch:hover,
  .b24-ai-helper-launch:focus,
  .b24-ai-helper-launch:focus-visible,
  .b24-ai-helper-launch:active,
  .b24-ai-helper-widget:focus-within .b24-ai-helper-launch {
    border: 0;
    outline: none;
    box-shadow: 0 8px 24px rgba(46,167,248,.25);
  }

  .b24-ai-helper-launch:hover,
  .b24-ai-helper-launch:focus-visible {
    transform: translateY(-2px);
  }

  .b24-ai-helper-launch:active {
    transform: translateY(0);
  }

  .b24-ai-helper-launch__glow {
    position: absolute;
    inset: -6px;
    border: 0;
    border-radius: 50%;
    background: rgba(47, 198, 246, 0.16);
    animation: b24-ai-helper-pulse 2.5s ease-in-out infinite;
    pointer-events: none;
  }

  .b24-ai-helper-launch__icon {
    position: relative;
    z-index: 1;
    display: flex;
    width: 30px;
    height: 30px;
  }

  .b24-ai-helper-launch__svg {
    width: 100%;
    height: 100%;
    fill: rgba(255, 255, 255, 0.96);
    stroke: var(--b24-ai-helper-blue-dark);
    stroke-linecap: round;
    stroke-width: 1.8;
  }

  .b24-ai-helper-card {
    position: absolute;
    right: 0;
    bottom: 70px;
    width: min(316px, calc(100vw - 40px));
    padding: 18px;
    border: 1px solid var(--b24-ai-helper-border);
    border-radius: 18px;
    background: linear-gradient(180deg, #ffffff 0%, #fbfdff 100%);
    box-shadow: var(--b24-ai-helper-shadow);
    opacity: 0;
    visibility: hidden;
    transform: translateY(14px) scale(0.98);
    transform-origin: right bottom;
    transition: opacity 0.22s ease, transform 0.22s ease, visibility 0.22s ease;
  }

  .b24-ai-helper-card:focus,
  .b24-ai-helper-card:focus-visible,
  .b24-ai-helper-card:active,
  .b24-ai-helper-card:focus-within {
    outline: none;
    border-color: var(--b24-ai-helper-border);
    box-shadow: var(--b24-ai-helper-shadow);
  }

  .b24-ai-helper-widget.b24-ai-helper-widget--open .b24-ai-helper-card {
    opacity: 1;
    visibility: visible;
    transform: translateY(0) scale(1);
  }

  .b24-ai-helper-widget.b24-ai-helper-widget--open .b24-ai-helper-launch {
    opacity: 0.92;
  }

  .b24-ai-helper-card__header {
    display: block;
    text-align: left;
  }

  .b24-ai-helper-title {
    margin: 0;
    color: #1f2a44;
    font-size: 22px;
    font-weight: 700;
    line-height: 1.15;
    text-align: left;
  }

  .b24-ai-helper-subtitle {
    margin: 7px 0 0;
    color: #5f6f89;
    font-size: 13px;
    font-weight: 400;
    line-height: 1.35;
    text-align: left;
  }

  .b24-ai-helper-options {
    display: grid;
    gap: 6px;
    margin-top: 14px;
  }

  .b24-ai-helper-option {
    display: grid;
    grid-template-columns: 18px 20px minmax(0, 1fr);
    align-items: center;
    gap: 9px;
    width: 100%;
    min-height: 40px;
    padding: 8px 11px;
    border: 1px solid rgba(47, 198, 246, 0.16);
    border-radius: 12px;
    color: var(--b24-ai-helper-text);
    background: #ffffff;
    box-shadow: 0 6px 16px rgba(22, 48, 93, 0.05);
    font-family: inherit;
    text-align: left;
    cursor: pointer;
    transition:
      background .25s ease,
      border-color .25s ease,
      box-shadow .25s ease,
      transform .25s ease;
  }

  .b24-ai-helper-option:hover {
    border-color: rgba(47, 198, 246, 0.34);
    background: #f8fcff;
    box-shadow: 0 8px 20px rgba(22, 48, 93, 0.08);
    transform: translateY(-1px);
  }

  .b24-ai-helper-option:focus,
  .b24-ai-helper-option:focus-visible,
  .b24-ai-helper-option:active,
  .b24-ai-helper-option:focus-within {
    border-color: rgba(46, 167, 248, 0.52);
    background: #f8fcff;
    box-shadow: 0 0 0 3px rgba(46,167,248,.2), 0 8px 20px rgba(22, 48, 93, 0.08);
    outline: none;
    transform: translateY(-1px);
  }

  .b24-ai-helper-option--selected,
  .b24-ai-helper-option--selected:hover,
  .b24-ai-helper-option--selected:active {
    background: #f4fbff;
    border-color: #2ea7f8;
    box-shadow: 0 6px 18px rgba(46,167,248,.1);
    outline: none;
    transform: translateY(-1px);
  }

  .b24-ai-helper-option--selected:hover {
    box-shadow: 0 8px 22px rgba(46,167,248,.14);
  }

  .b24-ai-helper-option--selected:focus,
  .b24-ai-helper-option--selected:focus-visible,
  .b24-ai-helper-option--selected:focus-within {
    background: #f4fbff;
    border-color: #2ea7f8;
    box-shadow: 0 0 0 3px rgba(46,167,248,.2), 0 6px 18px rgba(46,167,248,.1);
    outline: none;
    transform: translateY(-1px);
  }

  .b24-ai-helper-option__title {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.25;
  }

  .b24-ai-helper-option__check {
    position: relative;
    width: 18px;
    height: 18px;
    border: 1.5px solid #aab8c9;
    border-radius: 5px;
    background: #ffffff;
    transition: background .2s ease, border-color .2s ease, box-shadow .2s ease;
  }

  .b24-ai-helper-option__check::after {
    position: absolute;
    top: 3px;
    left: 5px;
    width: 5px;
    height: 8px;
    border: solid #ffffff;
    border-width: 0 2px 2px 0;
    content: "";
    opacity: 0;
    transform: rotate(45deg) scale(.7);
    transition: opacity .2s ease, transform .2s ease;
  }

  .b24-ai-helper-option--selected .b24-ai-helper-option__check {
    border-color: var(--b24-ai-helper-blue-strong);
    background: var(--b24-ai-helper-blue-strong);
    box-shadow: 0 2px 6px rgba(7, 139, 211, .2);
  }

  .b24-ai-helper-option--selected .b24-ai-helper-option__check::after {
    opacity: 1;
    transform: rotate(45deg) scale(1);
  }

  .b24-ai-helper-option__icon {
    width: 20px;
    height: 20px;
    fill: none;
    stroke: #71839b;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 1.7;
    transition: stroke .2s ease;
  }

  .b24-ai-helper-option--selected .b24-ai-helper-option__icon {
    stroke: var(--b24-ai-helper-blue-strong);
  }

  .b24-ai-helper-selection-count {
    margin: 9px 0 -5px;
    color: #718096;
    font-size: 12px;
    line-height: 1.3;
    text-align: center;
  }

  .b24-ai-helper-selection-count[hidden] {
    display: none;
  }

  .b24-ai-helper-action {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    margin-top: 12px;
    padding: 12px 16px;
    border: 0;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
    line-height: 1.2;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
    transition: transform 0.24s ease, box-shadow 0.24s ease, opacity 0.24s ease, filter 0.24s ease;
  }

  .b24-ai-helper-action:hover,
  .b24-ai-helper-action:focus,
  .b24-ai-helper-action:focus-visible,
  .b24-ai-helper-action:active,
  .b24-ai-helper-action:focus-within {
    outline: none;
    border: 0;
  }

  .b24-ai-helper-action:hover,
  .b24-ai-helper-action:focus-visible {
    transform: translateY(-2px);
  }

  .b24-ai-helper-action--primary,
  .b24-ai-helper-action--primary:hover,
  .b24-ai-helper-action--primary:focus,
  .b24-ai-helper-action--primary:focus-visible,
  .b24-ai-helper-action--primary:active {
    color: #ffffff;
    background: linear-gradient(135deg, #27c2f4 0%, var(--b24-ai-helper-blue-strong) 100%);
  }

  .b24-ai-helper-action--primary {
    opacity: 0.85;
    filter: saturate(0.9);
    box-shadow: 0 10px 22px rgba(7, 139, 211, 0.24);
  }

  .b24-ai-helper-action--primary.b24-ai-helper-action--active {
    opacity: 1;
    filter: none;
  }

  .b24-ai-helper-action--primary:hover,
  .b24-ai-helper-action--primary:focus,
  .b24-ai-helper-action--primary:focus-visible,
  .b24-ai-helper-action--primary:active {
    box-shadow: 0 0 0 3px rgba(46,167,248,.22), 0 10px 24px rgba(33, 150, 243, 0.3);
  }

  .b24-ai-helper-action--primary:active {
    transform: translateY(-1px);
  }

  @keyframes b24-ai-helper-pulse {
    0%, 100% {
      opacity: 0.62;
      transform: scale(0.94);
    }

    50% {
      opacity: 0.22;
      transform: scale(1.08);
    }
  }

  @media (max-width: 560px) {
    .b24-ai-helper-widget {
      right: 16px;
      bottom: 16px;
      left: 16px;
    }

    .b24-ai-helper-launch {
      margin-left: auto;
      width: 54px;
      height: 54px;
    }

    .b24-ai-helper-card {
      right: 0;
      bottom: 68px;
      width: 100%;
      max-height: calc(100vh - 96px);
      overflow-y: auto;
      padding: 16px;
    }

    .b24-ai-helper-title {
      font-size: 20px;
      line-height: 1.15;
    }

    .b24-ai-helper-subtitle {
      font-size: 13px;
      line-height: 1.35;
    }

    .b24-ai-helper-options {
      gap: 7px;
      margin-top: 14px;
    }

    .b24-ai-helper-option {
      padding: 10px 12px;
    }

    .b24-ai-helper-option__title,
    .b24-ai-helper-action {
      font-size: 14px;
    }
  }
</style>

<script>
  (function (){var b24AiHelperWidget = document.querySelector('[data-b24-ai-helper-widget]');

    if (!b24AiHelperWidget){return;}var b24AiHelperLaunch = b24AiHelperWidget.querySelector('.b24-ai-helper-launch');
    var b24AiHelperCard = b24AiHelperWidget.querySelector('.b24-ai-helper-card');
    var b24AiHelperOptions = b24AiHelperWidget.querySelectorAll('[data-b24-ai-helper-option]');
    var b24AiHelperCta = b24AiHelperWidget.querySelector('[data-b24-ai-helper-cta]');
    var b24AiHelperCount = b24AiHelperWidget.querySelector('[data-b24-ai-helper-count]');
    var b24AiHelperAutoOpenedKey = 'b24AiHelperAutoOpened';
    var b24AiHelperUserInteractedKey = 'b24AiHelperUserInteracted';
    var b24AiHelperAutoOpenDelay = 15000;
    var b24AiHelperDesktopAutoOpenBreakpoint = 768;
    var b24AiHelperAutoOpened = sessionStorage.getItem(b24AiHelperAutoOpenedKey) === 'true';
    var b24AiHelperUserInteracted = sessionStorage.getItem(b24AiHelperUserInteractedKey) === 'true';

    function b24AiHelperCanAutoOpen(){return window.innerWidth > b24AiHelperDesktopAutoOpenBreakpoint;}

    function b24AiHelperRememberAutoOpened(){b24AiHelperAutoOpened = true;
      sessionStorage.setItem(b24AiHelperAutoOpenedKey, 'true');}

    function b24AiHelperRememberUserInteraction(){b24AiHelperUserInteracted = true;
      sessionStorage.setItem(b24AiHelperUserInteractedKey, 'true');}

    function b24AiHelperSetOpen(isOpen){b24AiHelperWidget.classList.toggle('b24-ai-helper-widget--open', isOpen);
      b24AiHelperLaunch.setAttribute('aria-expanded', String(isOpen));
      b24AiHelperCard.setAttribute('aria-hidden', String(!isOpen));}

    b24AiHelperSetOpen(false);

    var b24AiHelperAutoOpenTimer = null;

    if (b24AiHelperCanAutoOpen()){b24AiHelperAutoOpenTimer = setTimeout(function (){if (!b24AiHelperCanAutoOpen() || b24AiHelperAutoOpened || b24AiHelperUserInteracted || b24AiHelperWidget.classList.contains('b24-ai-helper-widget--open')){return;}

        b24AiHelperSetOpen(true);
        b24AiHelperRememberAutoOpened();}, b24AiHelperAutoOpenDelay);}

    b24AiHelperLaunch.addEventListener('click', function (){b24AiHelperRememberUserInteraction();
      clearTimeout(b24AiHelperAutoOpenTimer);
      b24AiHelperSetOpen(!b24AiHelperWidget.classList.contains('b24-ai-helper-widget--open'));});

    function b24AiHelperHighlightCta(){b24AiHelperCta.classList.add('b24-ai-helper-action--active');}

    function b24AiHelperUpdateCount(){var b24AiHelperSelectedCount = b24AiHelperWidget.querySelectorAll('.b24-ai-helper-option--selected').length;
      b24AiHelperCount.hidden = b24AiHelperSelectedCount === 0;
      b24AiHelperCount.textContent = b24AiHelperSelectedCount === 0 ? '' : 'Выбрано инструментов: ' + b24AiHelperSelectedCount;}

    b24AiHelperOptions.forEach(function (b24AiHelperOption){b24AiHelperOption.addEventListener('click', function (){b24AiHelperRememberUserInteraction();
        clearTimeout(b24AiHelperAutoOpenTimer);
        var b24AiHelperIsSelected = b24AiHelperOption.classList.toggle('b24-ai-helper-option--selected');
        b24AiHelperOption.setAttribute('aria-pressed', String(b24AiHelperIsSelected));
        b24AiHelperUpdateCount();
        if (b24AiHelperIsSelected){b24AiHelperHighlightCta();}});});

    b24AiHelperCta.addEventListener('click', function (){b24AiHelperRememberUserInteraction();
      clearTimeout(b24AiHelperAutoOpenTimer);});

    document.addEventListener('keydown', function (event){if (event.key === 'Escape' && b24AiHelperWidget.classList.contains('b24-ai-helper-widget--open')){b24AiHelperRememberUserInteraction();
        clearTimeout(b24AiHelperAutoOpenTimer);
        b24AiHelperSetOpen(false);}});})();
</script>
